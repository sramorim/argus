name: CI

# Type-check e testes a cada push/PR para a main. NÃO corre CodeQL: o scan de
# código é feito pelo "default setup" do GitHub (code scanning), e ter um
# segundo CodeQL aqui entraria em conflito com ele. Este workflow existe também
# para o scan de "actions" ter um workflow válido e limpo a analisar.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Type-check e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # --include=dev é obrigatório: as devDependencies (vite, typescript,
      # linkedom, esbuild) são precisas para o type-check e para os testes.
      - name: Instalar dependências
        run: npm ci --include=dev

      - name: Type-check
        run: npm run typecheck

      - name: Testes (servidor + web)
        run: npm test
