<!--
  ARGOS — símbolo (o lobo geométrico).
  Identidade v3.0: cabeça de lobo frontal em facetas planas — minimalista,
  geométrica, legível como ícone Android.
  Geometria: coordenadas 0..32, simétrica em x=16. scripts/make-icons.mjs
  replica estas facetas para gerar os PNG; src/components/ui.tsx (Mark) usa
  as mesmas cores — o teste `ui.test.mts` falha se divergirem.
  Facetas: LIGHT #EAF7F0, MID #A9DCC3, SHADE #4E7A66, ACC #2FE08F, DARK #071F19.
-->
