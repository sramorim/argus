<!--
  ARGUS — símbolo (o olho do guardião).
  Geometria: coordenadas 0..32, espelhada exactamente por scripts/make-icons.mjs,
  que gera os PNG (favicon, apple-touch-icon, 192, 512) a partir da mesma forma.
  Cor: grafite de fundo, prata nos traços, vermelho profundo na pupila.
  Sem verde. Sem degradé berrante. Legível a 16 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ARGUS">
  <defs>
    <linearGradient id="argus-pupil" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="argus-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171C"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="6.9" fill="url(#argus-bg)"/>
  <circle cx="16" cy="16" r="13.7" fill="none" stroke="#C8CDD4" stroke-opacity=".34" stroke-width="1.4"/>
  <path d="M4.4 16C7.5 11.6 11.5 9.3 16 9.3s8.5 2.3 11.6 6.7c-3.1 4.4-7.1 6.7-11.6 6.7S7.5 20.4 4.4 16Z"
        fill="none" stroke="#C8CDD4" stroke-opacity=".95" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="16" cy="16" r="6.2" fill="none" stroke="#C8CDD4" stroke-opacity=".8" stroke-width="1.1"/>
  <circle cx="16" cy="16" r="3.2" fill="url(#argus-pupil)"/>
  <circle cx="18.3" cy="13.7" r="1.05" fill="#F5F7FA" fill-opacity=".85"/>
</svg>
