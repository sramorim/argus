<!--
  ARGOS — símbolo (o olho do guardião).
  Geometria: coordenadas 0..32, espelhada exactamente por scripts/make-icons.mjs,
  que gera os PNG (favicon, apple-touch-icon, 192, 512) a partir da mesma forma.
  Cor: as mesmas tokens da interface — azul eléctrico na íris, texto-2 nos
  traços. Sem verde. Legível a 16 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ARGOS">
  <defs>
    <linearGradient id="argos-pupila" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#1B6EF3"/>
    </linearGradient>
    <linearGradient id="argos-fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="6.9" fill="url(#argos-fundo)"/>
  <circle cx="16" cy="16" r="13.7" fill="none" stroke="#9AA7BD" stroke-opacity=".30" stroke-width="1.4"/>
  <path d="M4.4 16C7.5 11.6 11.5 9.3 16 9.3s8.5 2.3 11.6 6.7c-3.1 4.4-7.1 6.7-11.6 6.7S7.5 20.4 4.4 16Z"
        fill="none" stroke="#9AA7BD" stroke-opacity=".92" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="16" cy="16" r="6.2" fill="none" stroke="#9AA7BD" stroke-opacity=".72" stroke-width="1.1"/>
  <circle cx="16" cy="16" r="3.2" fill="url(#argos-pupila)"/>
  <circle cx="18.3" cy="13.7" r="1.05" fill="#FFFFFF" fill-opacity=".85"/>
</svg>
