# ARGUS — configuração do serviço no Render (Blueprint).
#
# Como usar: no Render, "New +" → "Blueprint" → escolher o repositório
# `sramorim/argus`. O Render lê este ficheiro e cria o serviço, o disco e as
# variáveis já com os valores certos.
#
# ---------------------------------------------------------------------------
# ROOT DIRECTORY: a raiz do repositório. NÃO existe aqui nenhuma pasta "probe".
#
# Este ficheiro vivia dentro de `central-amorim/probe/`, por isso trazia
# `rootDir: probe`. Quando o ARGUS passou a ter repositório próprio
# (sramorim/argus) com o código na raiz, esse `rootDir` passou a apontar para
# um directório inexistente e o Render recusava criar o serviço com:
#     "Root directory 'probe' does not exist"
# A correcção é não declarar `rootDir` — o Render constrói a partir da raiz.
# Todos os comandos abaixo são relativos à raiz (apps/server, apps/web).
# ---------------------------------------------------------------------------

services:
  - type: web                     # Web Service (precisa de responder HTTP; nao e Background Worker)
    name: argus
    runtime: node
    plan: starter                 # o plano Free nao tem disco persistente
    region: oregon
    branch: main
    # SEM `rootDir`: o ARGUS vive na raiz deste repositório.
    # (apps/server e apps/web são as workspaces npm, não um root directory.)
    numInstances: 1               # 1 só: SQLite num único ficheiro não aguenta 2 processos a escrever

    # ---- build e arranque ----
    # `npm ci --include=dev` instala as DUAS coisas:
    #   - as dependencias (hono, node:sqlite...), que o servidor precisa em runtime;
    #   - as devDependencies (vite, typescript, linkedom), que o `npm run build`
    #     precisa para gerar o frontend em apps/web/dist.
    # O `--include=dev` é obrigatório e não é redundante: as envVars abaixo põem
    # NODE_ENV=production, e o npm passa a omitir as devDependencies nesse caso.
    # Sem este `--include=dev` o build instala 9 pacotes, não encontra o vite e
    # morre — foi verificado, não é teórico.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    # ---- persistência ----
    disk:
      name: argus-data
      mountPath: /var/data        # o SQLite vive aqui: sobrevive a cada deploy
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: ARGUS_DB
        value: /var/data/argus.db
      # O segredo e do dono (sync: false = o Render pede o valor ao criar o serviço).
      # Gerar: openssl rand -hex 32
      # Dar-lho define a chave de cifragem das chaves BYOK e as sessoes. Guardar em seguranca:
      # se mudar, as sessoes caem e as chaves BYOK guardadas deixam de decifrar.
      - key: ARGUS_SECRET
        sync: false
      # O teu e-mail de administrador. Qualquer conta registada com este endereço
      # entra como administrador logo no primeiro login — é o caminho mais
      # simples, sem precisar de entrar por SSH para mexer no banco.
      # (Pode deixar vazio e promover depois por SQL.)
      - key: ARGUS_ADMIN_EMAILS
        sync: false
      - key: ARGUS_COOKIE_SECURE
        value: "true"
      - key: ARGUS_TRUST_PROXY
        value: "true"
      - key: ARGUS_PUBLIC_ORIGIN
        value: https://argus.senhoramorim.com.br

      # ---- identidade (o dono muda aqui, sem tocar em código) ----
      # O número de WhatsApp estava escrito à mão no frontend e estava errado
      # (faltava o 9 do celular). Vai validado no arranque: se não vier em
      # formato internacional válido, o servidor recusa arrancar em vez de gerar
      # um link de wa.me que não abre para ninguém.
      - key: ARGUS_CONTACTO_WHATSAPP
        value: "5547997876098"
      - key: ARGUS_AUTHOR
        value: SR. Amorim
      # Nome legal da pessoa. Não é mostrado no site — fica para contratos e
      # Nota Legal, onde a identidade legal tem de aparecer.
      - key: ARGUS_AUTHOR_LEGAL
        value: Daniel Senhor Amorim
      # O link do autor (site, LinkedIn…). Vazio = não aparece no rodapé.
      # - key: ARGUS_AUTHOR_LINK
      #   value: https://exemplo.com
      #
      # NOTA: ARGUS_ALLOWED_ORIGINS fica de fora de propósito. A app e a API são
      # servidas no mesmo domínio, portanto CORS desligado é o mais seguro
      # (o navegador bloqueia a leitura de qualquer outra origem). Se alguma vez
      # precisares de um domínio separado, declara-o aqui — nunca "*", que o
      # config.ts recusa no arranque.
